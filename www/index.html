    </div>

    <div id="console"></div>
</div>

    <script type="module">
        import { ZynStrudelOutput } from './strudel-output.js';
        
        const startBtn = document.getElementById('startBtn');

    const status = document.getElementById('status');
    const consoleEl = document.getElementById('console');
    const patchSelect = document.getElementById('patchSelect');
    const strudelSnippet = document.getElementById('strudelSnippet');
    const snippetContainer = document.getElementById('snippetContainer');

    function updateSnippet() {
        const patchName = patchSelect.value;
        const soundId = `zf2_${patchName}`;
        strudelSnippet.innerText = `await import('${window.location.origin}/strudel.js').then(async m => {
  await m.bootZyn({ baseUrl: '${window.location.origin}' });
});

note("60 64 67 [60,64,67]").s("${soundId}")`;
    }

    patchSelect.onchange = updateSnippet;
    updateSnippet();

    function log(msg) {
        const div = document.createElement('div');
        div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        consoleEl.appendChild(div);
        consoleEl.scrollTop = consoleEl.scrollHeight;
        console.log(msg);
    }

    let zynOutput = null;
    let sequenceInterval = null;

    document.getElementById('panicBtn').onclick = () => {
        if (!zynOutput) return;
        log("Panic triggered.");
        // Use MIDI All Notes Off
        zynOutput.instrument.node.sendMidi(0xB0, 0x7B, 0);
    };

    startBtn.onclick = async () => {
        if (startBtn.innerText === 'Stop Sequence') {
            clearInterval(sequenceInterval);
            sequenceInterval = null;
            startBtn.innerText = 'Start Sequence';
            log("Sequence stopped.");
            status.innerText = "Status: Idle";
            // Panic to clear hanging notes
            if (zynOutput) zynOutput.instrument.node.sendMidi(0xB0, 0x7B, 0);
            return;
        }

        if (!zynOutput) {
            startBtn.disabled = true;
            status.innerText = "Status: Booting WASM...";
            log("Initializing ZynStrudelOutput...");

            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                log("AudioContext state: " + audioCtx.state);
                await audioCtx.resume();
                log("AudioContext resumed, state: " + audioCtx.state);
                
                zynOutput = new ZynStrudelOutput(audioCtx);
                log("Calling zynOutput.init()...");
                await zynOutput.init('./zyn_wasm.wasm', './zyn-worklet.js');
                
                log("Engine Ready.");
                startBtn.disabled = false;
                // snippetContainer.style.display = 'block'; // Disabled as it's strudel related
            } catch (err) {
                log(`FATAL: ${err.message}`);
                console.error(err);
                status.innerText = "Status: Error!";
                startBtn.disabled = false;
                return;
            }
        }
        
        log("Starting sequence...");
        status.innerText = "Status: Playing";
        startBtn.innerText = 'Stop Sequence';
        startSequence();
    };

    function startSequence() {
        const notes = [60, 62, 64, 65, 67, 69, 71, 72];
        let step = 0;
        
        sequenceInterval = setInterval(() => {
            const note = notes[step % notes.length];
            const patchPath = `/patches/${patchSelect.value}.xiz`;
            
            // This mimics the logic in strudel.js
            // 1. Ensure internal patch is loaded
            zynOutput.instrument.loadInternalPatch(patchPath, 0);
            
            // 2. Play note
            log(`Playing Note: ${note} with patch ${patchPath}`);
            zynOutput.instrument.play({ note, velocity: 0.8 });
            
            // 3. Note off
            setTimeout(() => {
                if (zynOutput) zynOutput.instrument.play({ note, velocity: 0 });
            }, 300);
            
            step++;
        }, 600);
    }
</script>
